<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>数据提交系统</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vant@4/lib/index.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f6fa;
      padding-bottom: 100px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .page-header {
      background: linear-gradient(135deg, #1989fa 0%, #3a7bd5 100%);
      padding: 20px 16px 28px;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .page-header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .page-header p { font-size: 13px; opacity: 0.85; }
    .page-body { padding: 12px 12px 20px; margin-top: -12px; }

    .global-date-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
      color: #fff;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
    }
    .global-date-card .card-label {
      font-size: 13px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .global-date-card .van-field {
      padding: 0 !important;
      background: transparent !important;
    }
    .global-date-card .van-field__label {
      color: rgba(255,255,255,0.85) !important;
      width: 60px !important;
      font-size: 14px !important;
    }
    .global-date-card .van-field__body input {
      color: #fff !important;
      font-size: 18px !important;
      font-weight: 600;
      background: rgba(255,255,255,0.15) !important;
      border-radius: 8px !important;
      padding: 6px 12px !important;
    }
    .global-date-card .van-field__body input::placeholder {
      color: rgba(255,255,255,0.5) !important;
    }
    .global-date-card .van-icon { color: #fff !important; }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 10px;
    }
    .stats-bar .count { font-size: 14px; color: #646566; }
    .stats-bar .count strong { color: #1989fa; font-size: 16px; }

    .record-card {
      background: #fff;
      border-radius: 14px;
      padding: 0 16px 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }
    .record-card .card-color-bar {
      height: 3px;
      background: linear-gradient(90deg, #1989fa, #07c160);
      margin: 0 -16px 0;
    }
    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    .record-header .left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .record-index {
      font-size: 12px;
      font-weight: 600;
      color: #1989fa;
      background: #ecf5ff;
      padding: 2px 12px;
      border-radius: 20px;
    }
    .btn-minus {
      color: #ee0a24;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      user-select: none;
      border-radius: 50%;
    }
    .btn-minus:active { transform: scale(0.8); background: #fef0f0; }
    .record-fields { padding-top: 6px; }
    .record-fields .van-field { padding: 4px 0 !important; }
    .record-fields .van-field__label {
      width: 76px !important;
      font-size: 13px !important;
      color: #646566;
    }
    .record-fields .van-field__body input { font-size: 14px !important; }
    .record-fields .time-field .van-field__label {
      color: #1989fa !important;
      font-weight: 600;
    }
    .record-fields .time-field .van-field__body input {
      background: #f0f7ff !important;
      border-radius: 6px !important;
      padding: 4px 10px !important;
    }

    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      padding: 10px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
      z-index: 999;
      border-top: 1px solid #ebedf0;
    }
    .footer-bar .van-button {
      flex: 1;
      height: 46px;
      border-radius: 23px;
      font-size: 15px;
      font-weight: 500;
    }
    .footer-bar .van-button--primary {
      background: #f0f5ff;
      border-color: #f0f5ff;
      color: #1989fa;
    }
    .footer-bar .van-button--success {
      background: linear-gradient(135deg, #07c160, #06ad56);
      border-color: transparent;
      color: #fff;
    }

    .progress-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .progress-dialog {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .progress-dialog .title {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      color: #323233;
    }
    .progress-dialog .total-progress { margin-bottom: 16px; }
    .progress-dialog .total-progress .info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #646566;
      margin-bottom: 6px;
    }
    .progress-dialog .total-progress .info .done { color: #07c160; font-weight: 600; }
    .progress-dialog .total-progress .info .fail { color: #ee0a24; font-weight: 600; }

    .record-progress-list { list-style: none; padding: 0; margin: 0; }
    .record-progress-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
    }
    .record-progress-item:last-child { border-bottom: none; }
    .record-progress-item .record-label { flex: 1; margin: 0 10px; color: #323233; }
    .record-progress-item .record-label small { color: #969799; font-size: 12px; }
    .record-progress-item .status-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0;
    }
    .record-progress-item .status-dot.pending { background: #c8c9cc; }
    .record-progress-item .status-dot.loading { background: #1989fa; animation: blink 0.6s ease-in-out infinite alternate; }
    .record-progress-item .status-dot.success { background: #07c160; }
    .record-progress-item .status-dot.fail { background: #ee0a24; }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

    .empty-tip { text-align: center; color: #969799; padding: 40px 0; font-size: 14px; }
  </style>
</head>
<body>

<div id="app">
  <div class="page-header">
    <h1>数据提交系统</h1>
    <p>统一日期，支持多条记录批量提交</p>
  </div>

  <div class="page-body">
    <div class="global-date-card">
      <div class="card-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        统一日期（所有记录共享）
      </div>
      <van-field
        v-model="globalDate"
        label="日期"
        placeholder="请选择日期"
        readonly
        is-link
        @click="showDatePicker = true"
        input-align="left"
      />
    </div>

    <div class="stats-bar">
      <span class="count">共 <strong>{{ records.length }}</strong> 条记录</span>
    </div>

    <div v-for="(item, index) in records" :key="item.id" class="record-card">
      <div class="card-color-bar"></div>
      <div class="record-header">
        <div class="left">
          <span class="record-index">#{{ index + 1 }}</span>
        </div>
        <span class="btn-minus" @click="removeRow(index)">✕</span>
      </div>
      <div class="record-fields">
        <van-field
          v-model="item.time"
          label="⏰ 时间"
          placeholder="如 08:30"
          clearable
          class="time-field"
        />
        <van-field
          v-model="item.bags"
          label="袋数"
          placeholder="请输入袋数"
          clearable
          type="number"
        />
        <van-field
          v-model="item.grossWeight"
          label="毛重"
          placeholder="请输入毛重"
          clearable
          type="number"
        />
        <van-field
          v-model="item.cargoWeight"
          label="货重"
          placeholder="请输入货重"
          clearable
          type="number"
        />
      </div>
    </div>

    <div v-if="records.length === 0" class="empty-tip">
      <van-icon name="edit" size="36" color="#c8c9cc" />
      <p style="margin-top:10px;">暂无数据，点击下方「添加一行」开始录入</p>
    </div>
  </div>

  <div class="footer-bar">
    <van-button type="primary" plain icon="plus" @click="addRow">添加一行</van-button>
    <van-button
      type="success"
      icon="send"
      @click="submitData"
      :loading="submitting"
      loading-text="提交中..."
    >提交</van-button>
  </div>

  <van-popup v-model:show="showDatePicker" position="bottom" round>
    <van-date-picker
      v-model="tempDate"
      title="选择日期"
      :min-date="minDate"
      :max-date="maxDate"
      @confirm="onDateConfirm"
      @cancel="showDatePicker = false"
    />
  </van-popup>

  <!-- 提交进度弹窗 -->
  <div v-if="showProgress" class="progress-overlay" @click.self="() => {}">
    <div class="progress-dialog">
      <div class="title">{{ progressDone ? '提交完成' : '正在提交...' }}</div>

      <div class="total-progress">
        <div class="info">
          <span>进度 {{ progressCompleted }} / {{ progressTotal }}</span>
          <span>成功 <span class="done">{{ progressSuccess }}</span><span v-if="progressFail > 0">，失败 <span class="fail">{{ progressFail }}</span></span></span>
        </div>
        <van-progress
          :percentage="progressPercent"
          :stroke-width="8"
          :color="progressDone && progressFail === 0 ? '#07c160' : (progressFail > 0 ? '#ee0a24' : '#1989fa')"
          :track-color="'#f0f0f0'"
          pivot-text=""
        />
      </div>

      <ul class="record-progress-list">
        <li v-for="(p, idx) in progressList" :key="idx" class="record-progress-item">
          <span class="status-dot" :class="p.status"></span>
          <span class="record-label">
            第 {{ idx + 1 }} 条
            <small v-if="p.time">⏰{{ p.time }}</small>
          </span>
          <span v-if="p.status === 'success'" style="color:#07c160;font-size:12px;">✓</span>
          <span v-else-if="p.status === 'fail'" style="color:#ee0a24;font-size:12px;" :title="p.error">✗</span>
          <span v-else-if="p.status === 'loading'" style="color:#1989fa;font-size:12px;">⋯</span>
          <span v-else style="color:#c8c9cc;font-size:12px;">—</span>
        </li>
      </ul>

      <div style="margin-top:16px;display:flex;gap:10px;">
        <template v-if="!progressDone">
          <van-button type="default" block disabled round>请稍候...</van-button>
        </template>
        <template v-if="progressDone">
          <van-button type="default" block round @click="closeProgress">关闭</van-button>
          <van-button v-if="progressFail > 0" type="danger" block round plain @click="retryFailed">重试失败项</van-button>
        </template>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>

<script>
const { createApp, ref, watch, onMounted, nextTick, computed } = Vue;

const app = createApp({
  setup() {
    const records = ref([]);
    const globalDate = ref('');
    const showDatePicker = ref(false);
    const tempDate = ref(new Date());
    const submitting = ref(false);
    const showProgress = ref(false);
    const progressList = ref([]);
    const progressCompleted = ref(0);
    const progressSuccess = ref(0);
    const progressFail = ref(0);
    const progressTotal = ref(0);
    const progressDone = ref(false);
    const failedItems = ref([]);

    const STORAGE_KEY = 'data_records_draft_v3';
    const DATE_KEY = 'data_global_date_v3';
    const minDate = new Date(2020, 0, 1);
    const maxDate = new Date(2030, 11, 31);

    const progressPercent = computed(() => {
      if (progressTotal.value === 0) return 0;
      return Math.round((progressCompleted.value / progressTotal.value) * 100);
    });

    const loadFromCache = () => {
      try {
        const cachedDate = localStorage.getItem(DATE_KEY);
        if (cachedDate) globalDate.value = cachedDate;
        const cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) {
            records.value = parsed;
            return;
          }
        }
      } catch (_) {}
      records.value = [createEmptyRow()];
    };

    const createEmptyRow = () => ({
      id: Date.now() + Math.random().toString(36).slice(2, 6),
      time: '',
      bags: '',
      grossWeight: '',
      cargoWeight: ''
    });

    const onDateConfirm = ({ selectedValues }) => {
      const year = selectedValues[0];
      const month = String(selectedValues[1]).padStart(2, '0');
      const day = String(selectedValues[2]).padStart(2, '0');
      globalDate.value = `${year}-${month}-${day}`;
      showDatePicker.value = false;
      localStorage.setItem(DATE_KEY, globalDate.value);
    };

    const addRow = () => {
      records.value.push(createEmptyRow());
      nextTick(() => {
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
      });
    };

    const removeRow = (index) => {
      if (records.value.length <= 1) {
        const row = records.value[0];
        row.time = ''; row.bags = ''; row.grossWeight = ''; row.cargoWeight = '';
        vant.showToast({ message: '已清空内容', icon: 'info' });
        return;
      }
      vant.showConfirmDialog({
        title: '确认删除',
        message: `确定要删除第 ${index + 1} 行吗？`,
        confirmButtonColor: '#ee0a24'
      }).then(() => {
        records.value.splice(index, 1);
        vant.showToast({ message: '已删除', icon: 'success' });
      }).catch(() => {});
    };

    watch(records, (newVal) => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(newVal)); } catch (_) {}
    }, { deep: true });

    // --- 提交 ---
    const submitData = async () => {
      if (!globalDate.value || globalDate.value.trim() === '') {
        vant.showToast({ message: '请先选择日期', icon: 'fail' });
        return;
      }

      // 只验证时间（每条记录都需要时间）
      const invalidRows = [];
      for (let i = 0; i < records.value.length; i++) {
        if (!records.value[i].time || records.value[i].time.trim() === '') {
          invalidRows.push(i + 1);
        }
      }
      if (invalidRows.length > 0) {
        vant.showToast({ message: `第 ${invalidRows.join('、')} 行「时间」不能为空`, icon: 'fail', duration: 2000 });
        return;
      }

      submitting.value = true;
      showProgress.value = true;
      progressDone.value = false;
      progressCompleted.value = 0;
      progressSuccess.value = 0;
      progressFail.value = 0;
      progressTotal.value = records.value.length;
      failedItems.value = [];

      progressList.value = records.value.map(r => ({
        status: 'pending',
        time: r.time,
        error: ''
      }));

      // 立即标记为 loading，让用户看到反馈
      for (let i = 0; i < progressList.value.length; i++) {
        progressList.value[i].status = 'loading';
      }

      const recordsToSubmit = records.value.map(r => ({
        time: r.time,
        bags: r.bags || '',
        grossWeight: r.grossWeight || '',
        cargoWeight: r.cargoWeight || ''
      }));

      try {
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            globalDate: globalDate.value,
            records: recordsToSubmit
          })
        });

        const result = await response.json();

        if (!response.ok) {
          for (let i = 0; i < progressList.value.length; i++) {
            progressList.value[i].status = 'fail';
            progressList.value[i].error = result.error || '提交失败';
          }
          progressCompleted.value = records.value.length;
          progressFail.value = records.value.length;
          progressDone.value = true;
          submitting.value = false;
          return;
        }

        if (result.results && Array.isArray(result.results)) {
          for (let i = 0; i < result.results.length; i++) {
            const r = result.results[i];
            progressList.value[i].status = r.success ? 'success' : 'fail';
            if (!r.success) {
              progressList.value[i].error = r.error || `HTTP ${r.status}`;
              failedItems.value.push(i);
            }
            progressCompleted.value = i + 1;
            if (r.success) progressSuccess.value++;
            else progressFail.value++;
            await new Promise(resolve => setTimeout(resolve, 60));
          }
        }
      } catch (err) {
        for (let i = 0; i < records.value.length; i++) {
          progressList.value[i].status = 'fail';
          progressList.value[i].error = '网络错误: ' + err.message;
        }
        progressCompleted.value = records.value.length;
        progressFail.value = records.value.length;
      }

      progressDone.value = true;
      submitting.value = false;

      if (progressFail.value === 0) {
        vant.showToast({ message: `全部提交成功！共 ${records.value.length} 条`, icon: 'success', duration: 2000 });
      } else {
        vant.showToast({ message: `成功 ${progressSuccess.value} 条，失败 ${progressFail.value} 条`, icon: 'fail', duration: 3000 });
      }
    };

    const closeProgress = () => {
      showProgress.value = false;
    };

    const retryFailed = async () => {
      if (failedItems.value.length === 0) return;

      const failIndexes = [...failedItems.value];
      const failedRecords = failIndexes.map(idx => ({
        originalIndex: idx,
        time: records.value[idx].time,
        bags: records.value[idx].bags || '',
        grossWeight: records.value[idx].grossWeight || '',
        cargoWeight: records.value[idx].cargoWeight || ''
      }));

      progressDone.value = false;
      progressCompleted.value = 0;
      progressSuccess.value = 0;
      progressFail.value = 0;
      progressTotal.value = failIndexes.length;

      for (const idx of failIndexes) {
        progressList.value[idx].status = 'loading';
        progressList.value[idx].error = '';
      }
      failedItems.value = [];

      try {
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            globalDate: globalDate.value,
            records: failedRecords.map(r => ({
              time: r.time,
              bags: r.bags,
              grossWeight: r.grossWeight,
              cargoWeight: r.cargoWeight
            }))
          })
        });

        const result = await response.json();

        if (result.results && Array.isArray(result.results)) {
          for (let i = 0; i < result.results.length; i++) {
            const r = result.results[i];
            const origIdx = failedRecords[i].originalIndex;
            progressList.value[origIdx].status = r.success ? 'success' : 'fail';
            if (!r.success) {
              progressList.value[origIdx].error = r.error || `HTTP ${r.status}`;
              failedItems.value.push(origIdx);
            }
            progressCompleted.value = i + 1;
            if (r.success) progressSuccess.value++;
            else progressFail.value++;
            await new Promise(resolve => setTimeout(resolve, 60));
          }
        }
      } catch (err) {
        for (const idx of failIndexes) {
          progressList.value[idx].status = 'fail';
          progressList.value[idx].error = '网络错误: ' + err.message;
        }
        progressCompleted.value = failIndexes.length;
        progressFail.value = failIndexes.length;
      }

      progressDone.value = true;

      if (progressFail.value === 0) {
        vant.showToast({ message: '重试全部成功！', icon: 'success', duration: 2000 });
      } else {
        vant.showToast({ message: `重试后仍有 ${progressFail.value} 条失败`, icon: 'fail', duration: 3000 });
      }
    };

    onMounted(() => { loadFromCache(); });

    return {
      records, globalDate, showDatePicker, tempDate, minDate, maxDate,
      submitting, showProgress, progressList, progressCompleted,
      progressSuccess, progressFail, progressTotal, progressDone, progressPercent,
      addRow, removeRow, submitData, onDateConfirm, closeProgress, retryFailed
    };
  }
});

app.use(vant);
app.mount('#app');
</script>
</body>
</html>
